<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>v11 - Calibrada na sua folha real</title>
<style>
body{margin:0;background:#eef2f5;font-family:Arial}header{background:#174a73;color:#fff;padding:10px;text-align:center}
main{max-width:900px;margin:auto;padding:8px}.card{background:#fff;padding:12px;border-radius:10px;margin:8px 0}
.btn{padding:12px;border:0;border-radius:8px;font-weight:bold;color:#fff;cursor:pointer;width:100%;margin-top:6px;font-size:16px}.g{background:#16834b}.b{background:#174a73}.gr{background:#666}
input,select{width:100%;padding:10px;border:1px solid #aaa;border-radius:6px;margin-top:4px}
#camBox{position:relative;background:#000;border-radius:12px;overflow:hidden;max-width:540px;margin:10px auto}
#video{width:100%}#overlay{position:absolute;inset:0}
.guide{position:absolute;left:10%;top:6%;width:80%;height:42%;border:3px dashed #00ff00;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.7)}
.corner{position:absolute;width:30px;height:30px;border:5px solid #00ff00}.tl{top:-3px;left:-3px;border-right:0;border-bottom:0}.tr{top:-3px;right:-3px;border-left:0;border-bottom:0}.bl{bottom:-3px;left:-3px;border-right:0;border-top:0}.br{bottom:-3px;right:-3px;border-left:0;border-top:0}
#can{max-width:100%;border:3px solid #000;margin-top:8px;display:block}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px;border:1px solid #ddd;border-radius:8px;margin:4px 0}.item.ok{background:#d6f5de}
.hidden{display:none!important}
.q{border:1px solid #ddd;border-radius:6px;padding:5px;text-align:center;background:#fafafa}
</style>
</head>
<body>
<header><h1>v11 - AGORA VAI - Calibrada na sua foto</h1></header>
<main>
<div class="card">
<input id="inT" placeholder="Turma"><button class="btn g" id="btnT">+ Turma</button>
<select id="selT"></select><select id="selTC"></select>
</div>
<div class="card">
<div id="boxG" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(75px,1fr));gap:4px"></div>
<button class="btn g" id="btnG">💾 SALVAR GABARITO (10 Q)</button><div id="msgG" style="color:green;font-weight:bold"></div>
</div>
<div class="card">
<input id="inA" placeholder="Aluno"><button class="btn g" id="btnA">+ Aluno</button><div id="listC"></div>
<div id="boxCor" class="hidden">
<h3 id="titC"></h3>
<div id="camBox" class="hidden"><video id="video" autoplay playsinline></video><div id="overlay"><div class="guide"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div style="position:absolute;top:46%;width:100%;text-align:center;color:#0f0;background:rgba(0,0,0,.6);font-weight:bold">RETÂNGULO PRETO AQUI DENTRO</div></div></div></div>
<button class="btn b" id="btnCam">📷 ABRIR CÂMERA COM GUIA VERDE</button><button class="btn g hidden" id="btnCap" style="background:#0a5;font-size:20px">📸 CAPTURAR</button>
<input id="foto" type="file" accept="image/*">
<canvas id="can"></canvas>
<div id="msgAuto" style="background:#e8f5ff;padding:8px;border-radius:6px;margin-top:6px"></div>
<div id="boxR" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:4px;margin-top:8px"></div>
<button class="btn g hidden" id="btnConf">✅ SALVAR VERDE</button>
</div>
</div>
</main>
<script>
let turmas=JSON.parse(localStorage.getItem('t11')||'[]'), alunos=JSON.parse(localStorage.getItem('a11')||'[]'), gab=JSON.parse(localStorage.getItem('g11')||'[]'), notas=JSON.parse(localStorage.getItem('n11')||'[]');
let atual=null, cfg={qtd:10,alt:5}; const L=['A','B','C','D','E']; const $=id=>document.getElementById(id);
function save(){localStorage.setItem('t11',JSON.stringify(turmas));localStorage.setItem('a11',JSON.stringify(alunos));localStorage.setItem('g11',JSON.stringify(gab));localStorage.setItem('n11',JSON.stringify(notas));}
function render(){ $('selT').innerHTML=turmas.map(t=>`<option value="${t.id}">${t.nome}</option>`).join(''); $('selTC').innerHTML=$('selT').innerHTML; let tid=+$('selTC').value; let lista=tid?alunos.filter(a=>a.tid==tid):[]; $('listC').innerHTML=lista.map(a=>{let n=notas.find(x=>x.aid==a.id); return `<div class="item ${n?'ok':''}"><span><b>${a.nome}</b> ${n?`VERDE ${n.ac}/10 Nota ${n.nota.toFixed(1)}`:''}</span><button class="btn g" style="width:auto" onclick="abrir(${a.id})">Corrigir</button></div>`}).join('')||'Sem alunos'; buildG();}
function buildG(){$('boxG').innerHTML=''; for(let i=0;i<10;i++){let v=gab[i]||''; $('boxG').innerHTML+=`<div class="q"><b>${i+1}</b><select id="g${i}"><option value="">-</option>${L.map(l=>`<option ${l==v?'selected':''}>${l}</option>`).join('')}</select></div>`}}
$('btnT').onclick=()=>{let n=$('inT').value.trim(); if(!n)return; turmas.push({id:Date.now(),nome:n}); $('inT').value=''; save(); render();};
$('btnA').onclick=()=>{let n=$('inA').value.trim(), tid=+$('selT').value; if(!n||!tid)return alert('Escolha turma'); alunos.push({id:Date.now(),nome:n,tid}); $('inA').value=''; save(); render();};
$('btnG').onclick=()=>{let g=[]; for(let i=0;i<10;i++){let v=$('g'+i).value; if(!v)return alert('Falta Q'+(i+1)); g.push(v);} gab=g; save(); $('msgG').textContent='✅ SALVO '+gab.join(' ');};
window.abrir=(id)=>{if(!gab.length)return alert('Salve gabarito'); atual=alunos.find(a=>a.id==id); $('boxCor').classList.remove('hidden'); $('titC').textContent='Aluno: '+atual.nome;};
$('selTC').onchange=render;
let stream=null; function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;} $('camBox').classList.add('hidden'); $('btnCam').classList.remove('hidden'); $('btnCap').classList.add('hidden');}
$('btnCam').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); $('video').srcObject=stream; $('camBox').classList.remove('hidden'); $('btnCam').classList.add('hidden'); $('btnCap').classList.remove('hidden');}catch(e){alert(e.message)}};
$('btnCap').onclick=()=>{let v=$('video'), c=$('can'), x=c.getContext('2d'); c.width=v.videoWidth; c.height=v.videoHeight; x.drawImage(v,0,0); stopCam(); process(c);};
$('foto').addEventListener('change',e=>{let f=e.target.files[0]; if(!f)return; let img=new Image(); img.onload=()=>{let c=$('can'), x=c.getContext('2d'); c.width=img.width; c.height=img.height; x.drawImage(img,0,0); process(c);}; img.src=URL.createObjectURL(f);});

function process(can){
 let ctx=can.getContext('2d',{willReadFrequently:true}), w=can.width,h=can.height, d=ctx.getImageData(0,0,w,h).data;
 function gray(x,y){let i=(y*w+x)*4; return (d[i]+d[i+1]+d[i+2])/3}
 // Acha retângulo preto - varredura por borda escura
 let top=0,bottom=h,left=0,right=w;
 // acha top
 for(let y=0;y<h*0.6;y+=2){let cnt=0; for(let x=w*0.15;x<w*0.85;x+=4)if(gray(x,y)<50)cnt++; if(cnt>10){top=y; break;}}
 for(let y=h*0.6;y>0;y-=2){let cnt=0; for(let x=w*0.15;x<w*0.85;x+=4)if(gray(x,y)<50)cnt++; if(cnt>10){bottom=y; break;}}
 for(let x=0;x<w*0.6;x+=2){let cnt=0; for(let y=top;y<bottom;y+=4)if(gray(x,y)<50)cnt++; if(cnt>10){left=x; break;}}
 for(let x=w;x>w*0.4;x-=2){let cnt=0; for(let y=top;y<bottom;y+=4)if(gray(x,y)<50)cnt++; if(cnt>10){right=x; break;}}
 if(right-left<w*0.2){$('msgAuto').innerHTML='<b style="color:red">❌ Não achei retângulo. Chegue mais perto.</b>'; return;}
 let bw=right-left, bh=bottom-top;
 ctx.strokeStyle='#00ff00'; ctx.lineWidth=4; ctx.strokeRect(left,top,bw,bh);
 $('msgAuto').innerHTML='<b style="color:green">✅ Retângulo OK! Lendo...</b>';

 // CALIBRAÇÃO NOVA baseada na sua foto: medidas reais
 // Dentro do retângulo, as bolinhas começam em X= 29% e Y= 27%
 // Espaçamento entre bolinhas: 6.2% da largura do retângulo
 // Espaçamento entre linhas: 13.8% da altura do retângulo
 $('boxR').innerHTML=''; let leitura=[];
 for(let i=0;i<10;i++){
   let col = i>=5?1:0; let row = i%5;
   let baseX = left + bw*(col==0?0.29:0.71);
   let baseY = top + bh*(0.27 + row*0.138);
   let scores=[];
   for(let a=0;a<5;a++){
     let cx = baseX + a*bw*0.062;
     let cy = baseY;
     let r=Math.max(5,Math.floor(w*0.011)), sum=0,cnt=0;
     for(let yy=-r;yy<=r;yy++)for(let xx=-r;xx<=r;xx++)if(xx*xx+yy*yy<=r*r){
       let X=Math.min(w-1,Math.max(0,Math.round(cx+xx))), Y=Math.min(h-1,Math.max(0,Math.round(cy+yy)));
       sum+=255-gray(X,Y); cnt++;
     }
     scores.push(sum/cnt);
     ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.strokeStyle='rgba(255,255,0,0.8)'; ctx.lineWidth=1; ctx.stroke();
   }
   let best=Math.max(...scores), idx=scores.indexOf(best), letra=best>28?L[idx]:'';
   // só considera se contraste forte
   leitura.push(letra);
   let cxBest = baseX + idx*bw*0.062;
   ctx.beginPath(); ctx.arc(cxBest,baseY,9,0,Math.PI*2); ctx.strokeStyle=letra?'#00ff00':'#ff0000'; ctx.lineWidth=3; ctx.stroke();
   $('boxR').innerHTML+=`<div class="q"><b>${i+1}</b><select id="r${i}"><option value="">?</option>${L.map(l=>`<option ${l==letra?'selected':''}>${l}</option>`).join('')}</select><div style="font-size:10px">auto:${letra||'?'} gab:${gab[i]||'-'}</div></div>`;
 }
 $('msgAuto').innerHTML+=`<br>Leitura: <b>${leitura.join(' ')}</b> - confira e corrija se precisar`;
 $('btnConf').classList.remove('hidden');
}
$('btnConf').onclick=()=>{
 let resp=[]; for(let i=0;i<10;i++)resp.push($('r'+i).value||'');
 let ac=0; resp.forEach((x,i)=>{if(x==gab[i])ac++;}); let nota=ac/10*10;
 let idx=notas.findIndex(x=>x.aid==atual.id), obj={aid:atual.id,tid:atual.tid,ac,nota,resp};
 if(idx>=0)notas[idx]=obj; else notas.push(obj); save(); render(); alert('Salvo VERDE '+ac+'/10');
};
window.onload=()=>{buildG(); render();};
</script>
</body>
</html>
